name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Overlapping pushes: run one at a time, in order, so an older run never
# deploys after a newer one.
concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # validate --base needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate data (against the previous main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run validate -- --base ${{ github.event.before }}

      - name: Validate data (no base commit)
        if: github.event_name != 'push' || github.event.before == '0000000000000000000000000000000000000000'
        run: npm run validate

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - run: npm run build

      # After the build, so dashboard/src/generated/bundle.json exists for the imports.
      - name: Type-check
        run: npx tsc -p .

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets cannot be read in `if`, so expose them through env first.
    # The Vercel CLI reads VERCEL_ORG_ID / VERCEL_PROJECT_ID from env to pick the project.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip notice
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not set, skipping deploy."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 24
          cache: npm

      - name: Deploy to Vercel production
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

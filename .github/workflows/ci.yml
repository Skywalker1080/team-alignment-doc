name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Overlapping pushes: run one at a time, in order, so an older run never
# deploys after a newer one.
concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # validate --base needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate data (against the previous main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run validate -- --base ${{ github.event.before }}

      - name: Validate data (no base commit)
        if: github.event_name != 'push' || github.event.before == '0000000000000000000000000000000000000000'
        run: npm run validate

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets cannot be read in `if`, so expose them through env first.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set, skipping deploy."

      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: dashboard-dist
          path: dashboard/dist

      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dashboard/dist --project-name=team-alignment --branch=main

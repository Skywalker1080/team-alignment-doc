name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Overlapping pushes: run one at a time, in order, so an older run never
# deploys after a newer one.
concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # validate --base needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate data (against the previous main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npm run validate -- --base ${{ github.event.before }}

      - name: Validate data (no base commit)
        if: github.event_name != 'push' || github.event.before == '0000000000000000000000000000000000000000'
        run: npm run validate

      - run: npm test

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - run: npm run build

      # After the build, so dashboard/src/generated/bundle.json exists for the imports.
      - name: Type-check
        run: npx tsc -p .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  # Publishes the checked build to GitHub Pages, only from main and only after `check` passes.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
